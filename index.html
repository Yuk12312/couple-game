<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>情侶專屬好感遊戲</title>
  <style>
    :root {
      --pink: #ff6b9d;
      --pink-dark: #ff4580;
      --pink-light: #ffe0eb;
      --bg: linear-gradient(160deg, #fff5f8 0%, #ffe8f0 50%, #fff0f5 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
      background: var(--bg);
      color: #4a2c4a;
      min-height: 100vh;
      padding: 12px;
      padding-bottom: 40px;
      line-height: 1.45;
    }
    .container { max-width: 430px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(255, 107, 157, 0.12);
      margin-bottom: 14px;
      border: 1px solid rgba(255, 182, 193, 0.35);
    }
    h1 { text-align: center; color: var(--pink); font-size: 22px; margin-bottom: 14px; }
    h2 { text-align: center; color: var(--pink); font-size: 18px; margin-bottom: 12px; }
    h3 { font-size: 14px; color: var(--pink); margin: 10px 0 8px; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #ffc2d4;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
      background: #fff;
      transition: border-color .2s;
    }
    input:focus, select:focus { border-color: var(--pink); }
    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: transform .15s, opacity .15s;
    }
    button:active { transform: scale(0.97); }
    button.secondary {
      background: #fff;
      color: var(--pink);
      border: 1.5px solid #ffb6c9;
    }
    button.danger { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
    button.link-btn {
      background: transparent;
      color: var(--pink);
      font-size: 14px;
      font-weight: 500;
      padding: 6px;
      margin-top: -2px;
    }
    button.small {
      padding: 7px 12px;
      font-size: 12px;
      width: auto;
      display: inline-block;
      margin: 4px 4px 0 0;
      border-radius: 20px;
    }
    .points {
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      color: var(--pink);
      margin: 6px 0 4px;
      letter-spacing: -0.5px;
    }
    .hidden { display: none !important; }
    .error { color: #e74c3c; text-align: center; margin-bottom: 8px; font-size: 13px; }
    .success { color: #27ae60; text-align: center; margin-bottom: 8px; font-size: 13px; }
    .partner-info {
      background: var(--pink-light);
      padding: 10px 12px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 14px;
      font-size: 14px;
      color: #6b3a5a;
    }
    .status { text-align: center; margin: 8px 0; font-size: 13px; color: #999; }
    .nav {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: #fff;
      padding: 5px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(255,107,157,0.1);
    }
    .nav button {
      flex: 1;
      padding: 10px 4px;
      font-size: 13px;
      margin-bottom: 0;
      background: transparent;
      color: #888;
      border-radius: 12px;
      font-weight: 500;
    }
    .nav button.active {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
      box-shadow: 0 4px 12px rgba(255,107,157,0.35);
    }
    .item {
      background: #fffafc;
      border: 1px solid #ffe0eb;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      transition: transform .15s;
    }
    .item .title { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
    .meta { font-size: 12px; color: #888; margin-bottom: 4px; }
    .reward { color: var(--pink); font-weight: 600; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
    }
    .badge.N { background: #f1f2f6; color: #57606f; }
    .badge.R { background: #dff9fb; color: #0984e3; }
    .badge.SR { background: #e8e0ff; color: #6c5ce7; }
    .badge.SSR { background: #ffe0f0; color: #e84393; }
    .badge.UR { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); color: #d35400; }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.completed { background: #d4edda; color: #155724; }
    .badge.confirmed { background: #cce5ff; color: #004085; }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--pink);
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title::before {
      content: "";
      width: 4px;
      height: 14px;
      background: var(--pink);
      border-radius: 2px;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(40,40,40,0.92);
      color: white;
      padding: 11px 20px;
      border-radius: 30px;
      font-size: 13px;
      z-index: 999;
      display: none;
      max-width: 88%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .draw-result {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 14px 0 6px;
    }
    .draw-card {
      width: 96px;
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      animation: popIn .35s ease;
    }
    .draw-card.N { background: linear-gradient(145deg, #a4b0be, #747d8c); }
    .draw-card.R { background: linear-gradient(145deg, #70a1ff, #1e90ff); }
    .draw-card.SR { background: linear-gradient(145deg, #a29bfe, #6c5ce7); }
    .draw-card.SSR { background: linear-gradient(145deg, #fd79a8, #e84393); }
    .draw-card.UR { background: linear-gradient(145deg, #ffeaa7, #fdcb6e); color: #6b3e00; }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .sub-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .sub-nav button {
      flex: 1;
      padding: 9px;
      font-size: 13px;
      margin-bottom: 0;
      background: #fff;
      color: #888;
      border: 1.5px solid #ffd6e0;
      border-radius: 12px;
      font-weight: 500;
    }
    .sub-nav button.active {
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: white;
      border-color: transparent;
    }
    .card-visual {
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .card-visual.N { background: linear-gradient(135deg, #a4b0be, #747d8c); }
    .card-visual.R { background: linear-gradient(135deg, #70a1ff, #1e90ff); }
    .card-visual.SR { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
    .card-visual.SSR { background: linear-gradient(135deg, #fd79a8, #e84393); }
    .card-visual.UR { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); color: #6b3e00; }
    .card-visual .name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .card-visual .effect { font-size: 12px; opacity: 0.95; margin-bottom: 4px; }
    .card-visual .exec { font-size: 11px; opacity: 0.85; }
    .empty {
      text-align: center;
      padding: 20px 10px;
      color: #bbb;
      font-size: 13px;
    }
    .tip {
      background: #fff8fb;
      border: 1px dashed #ffb6c9;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      color: #a05a7a;
      margin-bottom: 12px;
      line-height: 1.5;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">

    <!-- 登入 -->
    <div id="auth-screen" class="card">
      <h1>❤️ 情侶好感遊戲</h1>
      <div id="auth-error" class="error"></div>
      <div id="auth-success" class="success"></div>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="密碼（至少6位）">
      <button type="button" onclick="register()">註冊</button>
      <button type="button" class="secondary" onclick="login()">登入</button>
      <button type="button" class="link-btn" onclick="forgotPassword()">忘記密碼？</button>
    </div>

    <!-- 配對 -->
    <div id="pair-screen" class="card hidden">
      <h2>情侶配對</h2>
      <div class="tip">把你的配對碼傳給另一半，或輸入對方的配對碼即可綁定。</div>
      <div id="pair-error" class="error"></div>
      <div id="pair-success" class="success"></div>
      <p class="status">你的配對碼</p>
      <div class="points" id="my-code">------</div>
      <p class="status">輸入對方的配對碼</p>
      <input type="text" id="partner-code" placeholder="6位配對碼" maxlength="6">
      <button type="button" onclick="pairWithCode()">確認配對</button>
      <button type="button" class="secondary" onclick="logout()">登出</button>
    </div>

    <!-- 主畫面 -->
    <div id="home-screen" class="hidden">
      <div class="nav">
        <button type="button" id="nav-home" class="active" onclick="switchTab('home')">點數</button>
        <button type="button" id="nav-todo" onclick="switchTab('todo')">待辦</button>
        <button type="button" id="nav-cards" onclick="switchTab('cards')">卡片</button>
      </div>

      <!-- 點數 -->
      <div id="tab-home" class="card">
        <h2>甜蜜點數</h2>
        <div class="points" id="my-points">0</div>
        <div class="partner-info">已配對：<span id="partner-name">—</span></div>
        <h3>送點數給對方</h3>
        <input type="number" id="send-amount" placeholder="輸入要送的點數" min="1">
        <button type="button" onclick="sendPoints()">送出點數</button>
        <div id="home-message" class="success"></div>
        <div class="section-title">每日任務</div>
        <div id="daily-tasks-list"></div>
        <button type="button" class="secondary" onclick="logout()" style="margin-top:12px;">登出</button>
      </div>

      <!-- 待辦（統一確認入口） -->
      <div id="tab-todo" class="hidden">
        <div class="card">
          <h2>待辦中心</h2>
          <div class="tip">這裡集中顯示需要你確認或處理的事項（任務 + 卡片使用）。</div>
          <div class="section-title">需要我確認</div>
          <div id="pending-confirm-list"></div>
          <div class="section-title">建立自訂任務</div>
          <input type="text" id="new-task-title" placeholder="任務內容（例如：親一下）">
          <input type="number" id="new-task-reward" placeholder="獎勵點數" min="1">
          <button type="button" onclick="createCustomTask()">建立任務</button>
          <div id="task-create-msg" class="success"></div>
          <div class="section-title">我發起的任務</div>
          <div id="my-created-tasks"></div>
          <div class="section-title">對方發起給我的</div>
          <div id="partner-tasks"></div>
        </div>
      </div>

      <!-- 卡片 -->
      <div id="tab-cards" class="hidden">
        <div class="sub-nav">
          <button type="button" id="sub-draw" class="active" onclick="switchCardSub('draw')">抽卡</button>
          <button type="button" id="sub-inv" onclick="switchCardSub('inv')">卡庫</button>
          <button type="button" id="sub-craft" onclick="switchCardSub('craft')">合成</button>
        </div>

        <div id="card-draw" class="card">
          <h2>幸運抽卡</h2>
          <p class="status">已抽 <span id="draw-count">0</span> 次 · 距離保底 <span id="draw-remain">100</span> 次</p>
          <button type="button" onclick="drawCard(1)">單抽（10點）</button>
          <button type="button" onclick="drawCard(10)">十連抽（100點）</button>
          <div id="draw-result" class="draw-result"></div>
        </div>

        <div id="card-inv" class="card hidden">
          <h2>我的卡庫</h2>
          <select id="rarity-filter" onchange="renderInventory()">
            <option value="all">全部稀有度</option>
            <option value="N">N</option>
            <option value="R">R</option>
            <option value="SR">SR</option>
            <option value="SSR">SSR</option>
            <option value="UR">UR</option>
          </select>
          <div id="inventory-list"></div>
        </div>

        <div id="card-craft" class="card hidden">
          <h2>卡片合成</h2>
          <div class="tip">3張低階卡片可合成1張高一階的卡片。</div>
          <button type="button" onclick="craftCard('R')">3張 N → 合成 R</button>
          <button type="button" onclick="craftCard('SR')">3張 R → 合成 SR</button>
          <button type="button" onclick="craftCard('SSR')">3張 SR → 合成 SSR</button>
          <button type="button" onclick="craftCard('UR')">3張 SSR → 合成 UR</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAqmFiLSEKgYNlscQkwGc4TVlEeh_GV-F8",
      authDomain: "couple-card-game-d8852.firebaseapp.com",
      projectId: "couple-card-game-d8852",
      storageBucket: "couple-card-game-d8852.firebasestorage.app",
      messagingSenderId: "1089424772159",
      appId: "1:1089424772159:web:8c0546fe679ba86cfbfc8a",
      measurementId: "G-0RLX4JTBGP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let userData = null;

    const CARD_POOL = [
      { id: 1, name: "讚美卡", rarity: "N", effect: "對方要連續講出你3個優點", execution: "認真講出3個不重複的優點" },
      { id: 2, name: "關心卡", rarity: "N", effect: "對方要主動問你今天過得怎麼樣", execution: "認真傾聽並回應" },
      { id: 3, name: "擁抱卡", rarity: "N", effect: "獲得一個溫暖的擁抱", execution: "擁抱至少15秒" },
      { id: 4, name: "笑聲卡", rarity: "N", effect: "對方要講一個笑話逗你笑", execution: "講笑話直到你笑為止" },
      { id: 5, name: "外賣卡", rarity: "R", effect: "對方幫你叫一次外賣", execution: "你選餐廳，對方付錢叫" },
      { id: 6, name: "按摩卡", rarity: "R", effect: "獲得10分鐘肩膀或頭部按摩", execution: "按摩10分鐘" },
      { id: 7, name: "電影卡", rarity: "R", effect: "一起睇一部你想睇的電影/劇", execution: "今晚一起睇" },
      { id: 8, name: "小禮物卡", rarity: "R", effect: "對方送你一個小禮物（50元內）", execution: "三天內兌現" },
      { id: 9, name: "約會卡", rarity: "SR", effect: "安排一次專屬約會", execution: "一週內完成一次約會" },
      { id: 10, name: "煮飯卡", rarity: "SR", effect: "對方親自煮一頓飯給你", execution: "親自下廚一餐" },
      { id: 11, name: "道歉卡", rarity: "SR", effect: "對方正式道歉並說明改善", execution: "認真道歉+寫下改善方法" },
      { id: 12, name: "驚喜卡", rarity: "SR", effect: "對方準備一個小驚喜", execution: "三天內給你驚喜" },
      { id: 13, name: "冷戰終結卡", rarity: "SSR", effect: "立即結束冷戰，恢復正常", execution: "放下爭執，恢復親密" },
      { id: 14, name: "願望卡", rarity: "SSR", effect: "對方幫你實現一個小願望", execution: "在合理範圍內實現" },
      { id: 15, name: "專屬日卡", rarity: "SSR", effect: "擁有完整一天的決定權", execution: "那天聽你的安排" },
      { id: 16, name: "情書卡", rarity: "SSR", effect: "收到一封手寫情書", execution: "親筆寫一封情書" },
      { id: 17, name: "神秘大禮卡", rarity: "UR", effect: "獲得一個用心的大驚喜", execution: "準備一個真正的驚喜" },
      { id: 18, name: "旅行卡", rarity: "UR", effect: "規劃一次短途旅行", execution: "一個月內完成短途旅行" },
      { id: 19, name: "無條件支持卡", rarity: "UR", effect: "對方無條件支持你一個決定", execution: "全力支持你的選擇" },
      { id: 20, name: "永遠卡", rarity: "UR", effect: "重新確認彼此的承諾", execution: "認真說出對未來的承諾" }
    ];

    const DAILY_TASKS = [
      { id: "d1", title: "對對方說「我愛你」", reward: 5 },
      { id: "d2", title: "親一下對方", reward: 8 },
      { id: "d3", title: "擁抱對方至少10秒", reward: 8 },
      { id: "d4", title: "主動關心對方今天過得如何", reward: 6 },
      { id: "d5", title: "一起做一件小事", reward: 10 }
    ];

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => t.style.display = "none", 2300);
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        await loadUserData();
      } else {
        showScreen("auth-screen");
      }
    });

    function showScreen(id) {
      ["auth-screen", "pair-screen", "home-screen"].forEach(s => {
        document.getElementById(s).classList.add("hidden");
      });
      document.getElementById(id).classList.remove("hidden");
    }

    function switchTab(tab) {
      document.getElementById("tab-home").classList.add("hidden");
      document.getElementById("tab-todo").classList.add("hidden");
      document.getElementById("tab-cards").classList.add("hidden");
      document.getElementById("nav-home").classList.remove("active");
      document.getElementById("nav-todo").classList.remove("active");
      document.getElementById("nav-cards").classList.remove("active");

      if (tab === "home") {
        document.getElementById("tab-home").classList.remove("hidden");
        document.getElementById("nav-home").classList.add("active");
        loadDailyOnly();
      } else if (tab === "todo") {
        document.getElementById("tab-todo").classList.remove("hidden");
        document.getElementById("nav-todo").classList.add("active");
        loadTasks();
      } else {
        document.getElementById("tab-cards").classList.remove("hidden");
        document.getElementById("nav-cards").classList.add("active");
        updateDrawProgress();
        renderInventory();
      }
    }

    function switchCardSub(sub) {
      document.getElementById("card-draw").classList.add("hidden");
      document.getElementById("card-inv").classList.add("hidden");
      document.getElementById("card-craft").classList.add("hidden");
      document.getElementById("sub-draw").classList.remove("active");
      document.getElementById("sub-inv").classList.remove("active");
      document.getElementById("sub-craft").classList.remove("active");

      if (sub === "draw") {
        document.getElementById("card-draw").classList.remove("hidden");
        document.getElementById("sub-draw").classList.add("active");
      } else if (sub === "inv") {
        document.getElementById("card-inv").classList.remove("hidden");
        document.getElementById("sub-inv").classList.add("active");
        renderInventory();
      } else {
        document.getElementById("card-craft").classList.remove("hidden");
        document.getElementById("sub-craft").classList.add("active");
      }
    }

    async function register() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("auth-error");
      const successEl = document.getElementById("auth-success");
      errorEl.textContent = ""; successEl.textContent = "";
      if (!email || !password) { errorEl.textContent = "請填寫完整"; return; }
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const code = generateCode();
        await db.collection("users").doc(cred.user.uid).set({
          email, points: 80, pairCode: code, partnerId: null,
          inventory: [], drawCount: 0, createdAt: new Date()
        });
        await db.collection("codes").doc(code).set({ uid: cred.user.uid });
      } catch (err) { errorEl.textContent = err.message; }
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("auth-error");
      const successEl = document.getElementById("auth-success");
      errorEl.textContent = ""; successEl.textContent = "";
      try { await auth.signInWithEmailAndPassword(email, password); }
      catch (err) { errorEl.textContent = "登入失敗，請檢查 Email 或密碼"; }
    }

    async function forgotPassword() {
      const email = document.getElementById("email").value.trim();
      const errorEl = document.getElementById("auth-error");
      const successEl = document.getElementById("auth-success");
      errorEl.textContent = ""; successEl.textContent = "";
      if (!email) { errorEl.textContent = "請先輸入你的 Email"; return; }
      try {
        await auth.sendPasswordResetEmail(email);
        successEl.textContent = "重設密碼信已寄出！請檢查信箱（包括垃圾郵件）";
        showToast("重設信已寄出");
      } catch (err) {
        errorEl.textContent = err.code === "auth/user-not-found" ? "找不到這個 Email 的帳號" : "寄送失敗";
      }
    }

    function logout() { auth.signOut(); }
    function generateCode() { return Math.floor(100000 + Math.random() * 900000).toString(); }

    async function loadUserData() {
      const doc = await db.collection("users").doc(currentUser.uid).get();
      if (!doc.exists) return;
      userData = doc.data();
      if (!userData.inventory) userData.inventory = [];
      if (!userData.drawCount) userData.drawCount = 0;

      if (userData.partnerId) {
        showScreen("home-screen");
        document.getElementById("my-points").textContent = userData.points;
        const pDoc = await db.collection("users").doc(userData.partnerId).get();
        if (pDoc.exists) {
          document.getElementById("partner-name").textContent = pDoc.data().email.split("@")[0];
        }
        updateDrawProgress();
        loadDailyOnly();
      } else {
        showScreen("pair-screen");
        document.getElementById("my-code").textContent = userData.pairCode;
      }
    }

    async function pairWithCode() {
      const code = document.getElementById("partner-code").value.trim();
      const errorEl = document.getElementById("pair-error");
      const successEl = document.getElementById("pair-success");
      errorEl.textContent = ""; successEl.textContent = "";
      if (code.length !== 6) { errorEl.textContent = "請輸入6位碼"; return; }
      if (code === userData.pairCode) { errorEl.textContent = "不能輸入自己的碼"; return; }
      try {
        const codeDoc = await db.collection("codes").doc(code).get();
        if (!codeDoc.exists) { errorEl.textContent = "配對碼不存在"; return; }
        const partnerId = codeDoc.data().uid;
        await db.collection("users").doc(currentUser.uid).update({ partnerId });
        await db.collection("users").doc(partnerId).update({ partnerId: currentUser.uid });
        successEl.textContent = "配對成功！";
        setTimeout(() => loadUserData(), 700);
      } catch (err) { errorEl.textContent = err.message; }
    }

    async function sendPoints() {
      const amount = parseInt(document.getElementById("send-amount").value);
      const msgEl = document.getElementById("home-message");
      msgEl.textContent = "";
      if (!amount || amount <= 0) { msgEl.textContent = "請輸入正確點數"; msgEl.className = "error"; return; }
      if (userData.points < amount) { msgEl.textContent = "點數不足"; msgEl.className = "error"; return; }
      try {
        await db.collection("users").doc(currentUser.uid).update({ points: firebase.firestore.FieldValue.increment(-amount) });
        await db.collection("users").doc(userData.partnerId).update({ points: firebase.firestore.FieldValue.increment(amount) });
        msgEl.textContent = `成功送出 ${amount} 點`;
        msgEl.className = "success";
        document.getElementById("send-amount").value = "";
        await loadUserData();
      } catch (err) { msgEl.textContent = "失敗"; msgEl.className = "error"; }
    }

    // ========== 任務 ==========
    async function createCustomTask() {
      const title = document.getElementById("new-task-title").value.trim();
      const reward = parseInt(document.getElementById("new-task-reward").value);
      const msgEl = document.getElementById("task-create-msg");
      msgEl.textContent = "";
      if (!title || !reward || reward <= 0) { msgEl.textContent = "請填寫完整"; msgEl.className = "error"; return; }
      if (userData.points < reward) { msgEl.textContent = "點數不足"; msgEl.className = "error"; return; }
      try {
        await db.collection("users").doc(currentUser.uid).update({ points: firebase.firestore.FieldValue.increment(-reward) });
        await db.collection("tasks").add({
          title, reward, creatorId: currentUser.uid, assigneeId: userData.partnerId,
          type: "custom", status: "pending", createdAt: new Date()
        });
        msgEl.textContent = "任務已建立";
        msgEl.className = "success";
        document.getElementById("new-task-title").value = "";
        document.getElementById("new-task-reward").value = "";
        await loadUserData();
        loadTasks();
      } catch (err) { msgEl.textContent = "失敗"; msgEl.className = "error"; }
    }

    async function loadDailyOnly() {
      if (!userData?.partnerId) return;
      const dailyList = document.getElementById("daily-tasks-list");
      dailyList.innerHTML = "";
      const todayStart = new Date(); todayStart.setHours(0,0,0,0);
      const dailySnap = await db.collection("tasks").where("assigneeId", "==", currentUser.uid).where("type", "==", "daily").get();
      const myDaily = {};
      dailySnap.forEach(doc => {
        const t = doc.data();
        const created = t.createdAt?.toDate?.() || new Date(0);
        if (created >= todayStart) myDaily[t.dailyId] = { id: doc.id, status: t.status };
      });
      DAILY_TASKS.forEach(dt => {
        const ex = myDaily[dt.id];
        let status = "", btn = "";
        if (!ex) btn = `<button type="button" class="small" onclick="claimDailyTask('${dt.id}','${dt.title}',${dt.reward})">我完成了</button>`;
        else if (ex.status === "completed") status = `<span class="badge completed">等待確認</span>`;
        else if (ex.status === "confirmed") status = `<span class="badge confirmed">已確認 +${dt.reward}</span>`;
        dailyList.innerHTML += `<div class="item"><div class="title">${dt.title} ${status}</div><div class="meta">獎勵 <span class="reward">+${dt.reward}</span></div>${btn}</div>`;
      });
    }

    async function loadTasks() {
      if (!userData?.partnerId) return;
      try {
        // 等待確認
        const pending = document.getElementById("pending-confirm-list");
        pending.innerHTML = "";
        const confSnap = await db.collection("tasks").where("status", "==", "completed").get();
        let has = false;

        confSnap.forEach(doc => {
          const t = doc.data();
          let shouldShow = false;
          let isCard = t.type === "card_use";

          if (isCard) {
            if (t.assigneeId === currentUser.uid) shouldShow = true;
          } else {
            if (t.type === "daily" && t.assigneeId === userData.partnerId) shouldShow = true;
            else if (t.type === "custom" && t.creatorId === currentUser.uid) shouldShow = true;
          }

          if (shouldShow) {
            has = true;
            const title = isCard ? `🃏 ${t.card?.name || t.title}` : t.title;
            const extra = isCard ? `<div class="meta">效果：${t.card?.effect || ""}</div><div class="meta">執行：${t.card?.execution || ""}</div>` : "";
            pending.innerHTML += `
              <div class="item">
                <div class="title">${title} <span class="badge completed">待確認</span></div>
                ${extra}
                <div class="meta">${isCard ? "卡片使用申請" : "獎勵 " + t.reward}</div>
                <button type="button" class="small" onclick="confirmTask('${doc.id}', ${t.reward || 0}, '${t.assigneeId}', '${t.type}', '${t.creatorId}')">確認</button>
                <button type="button" class="small danger" onclick="rejectTask('${doc.id}', ${t.reward || 0}, '${t.creatorId}', '${t.type}')">拒絕</button>
              </div>`;
          }
        });
        if (!has) pending.innerHTML = `<div class="empty">暫時沒有需要確認的事項</div>`;

        // 我發起的
        const myC = document.getElementById("my-created-tasks");
        myC.innerHTML = "";
        const mySnap = await db.collection("tasks").where("creatorId", "==", currentUser.uid).get();
        if (mySnap.empty) myC.innerHTML = `<div class="empty">暫時沒有</div>`;
        else mySnap.forEach(doc => {
          const t = doc.data();
          let s = t.status === "pending" ? "等待完成" : t.status === "completed" ? "等待確認" : t.status === "confirmed" ? "已確認" : "已拒絕";
          const prefix = t.type === "card_use" ? "🃏 " : "";
          myC.innerHTML += `<div class="item"><div class="title">${prefix}${t.title || t.card?.name}</div><div class="meta">${s}</div></div>`;
        });

        // 對方發起
        const pList = document.getElementById("partner-tasks");
        pList.innerHTML = "";
        const pSnap = await db.collection("tasks").where("assigneeId", "==", currentUser.uid).where("type", "==", "custom").get();
        if (pSnap.empty) pList.innerHTML = `<div class="empty">暫時沒有</div>`;
        else pSnap.forEach(doc => {
          const t = doc.data();
          let status = "", btn = "";
          if (t.status === "pending") { status = "待完成"; btn = `<button type="button" class="small" onclick="completeTask('${doc.id}')">我完成了</button>`; }
          else if (t.status === "completed") status = "等待確認";
          else if (t.status === "confirmed") status = `已確認 +${t.reward}`;
          pList.innerHTML += `<div class="item"><div class="title">${t.title}</div><div class="meta">${status}</div>${btn}</div>`;
        });
      } catch (e) { console.error(e); showToast("載入失敗"); }
    }

    async function claimDailyTask(id, title, reward) {
      try {
        await db.collection("tasks").add({
          dailyId: id, title, reward, creatorId: "system", assigneeId: currentUser.uid,
          type: "daily", status: "completed", createdAt: new Date()
        });
        showToast("已提交，等待對方確認");
        loadDailyOnly();
      } catch (e) { showToast("失敗"); }
    }

    async function completeTask(id) {
      try {
        await db.collection("tasks").doc(id).update({ status: "completed", completedAt: new Date() });
        showToast("已通知對方");
        loadTasks();
      } catch (e) { showToast("失敗"); }
    }

    async function confirmTask(id, reward, assigneeId, type, creatorId) {
      try {
        if (type === "card_use") {
          await db.collection("tasks").doc(id).update({ status: "confirmed", confirmedAt: new Date() });
          showToast("已確認卡片使用 ✨");
        } else {
          await db.collection("users").doc(assigneeId).update({ points: firebase.firestore.FieldValue.increment(reward) });
          await db.collection("tasks").doc(id).update({ status: "confirmed", confirmedAt: new Date() });
          showToast("已確認，點數已發放");
        }
        loadTasks();
        const doc = await db.collection("users").doc(currentUser.uid).get();
        if (doc.exists) {
          userData = doc.data();
          document.getElementById("my-points").textContent = userData.points;
        }
      } catch (e) { showToast("失敗"); }
    }

    async function rejectTask(id, reward, creatorId, type) {
      if (!confirm("確定拒絕？")) return;
      try {
        if (type === "card_use") {
          const taskDoc = await db.collection("tasks").doc(id).get();
          const t = taskDoc.data();
          if (t.card && t.creatorId) {
            const userRef = db.collection("users").doc(t.creatorId);
            const userSnap = await userRef.get();
            if (userSnap.exists) {
              const inv = userSnap.data().inventory || [];
              inv.push(t.card);
              await userRef.update({ inventory: inv });
            }
          }
          await db.collection("tasks").doc(id).update({ status: "rejected" });
          showToast("已拒絕，卡片已退回");
        } else {
          if (creatorId && creatorId !== "system") {
            await db.collection("users").doc(creatorId).update({ points: firebase.firestore.FieldValue.increment(reward) });
          }
          await db.collection("tasks").doc(id).update({ status: "rejected" });
          showToast("已拒絕");
        }
        loadTasks();
        await loadUserData();
      } catch (e) { showToast("操作失敗"); }
    }

    // ========== 卡片 ==========
    function updateDrawProgress() {
      const count = userData?.drawCount || 0;
      document.getElementById("draw-count").textContent = count;
      document.getElementById("draw-remain").textContent = 100 - (count % 100);
    }

    async function drawCard(times) {
      const cost = times * 10;
      if (userData.points < cost) { showToast("點數不足"); return; }

      try {
        await db.collection("users").doc(currentUser.uid).update({
          points: firebase.firestore.FieldValue.increment(-cost)
        });

        const resultDiv = document.getElementById("draw-result");
        resultDiv.innerHTML = "";
        const newCards = [];

        for (let i = 0; i < times; i++) {
          userData.drawCount = (userData.drawCount || 0) + 1;
          let rarity;
          if (userData.drawCount % 100 === 0) rarity = "UR";
          else {
            const r = Math.random();
            if (r < 0.01) rarity = "UR";
            else if (r < 0.05) rarity = "SSR";
            else if (r < 0.20) rarity = "SR";
            else if (r < 0.50) rarity = "R";
            else rarity = "N";
          }
          const pool = CARD_POOL.filter(c => c.rarity === rarity);
          const card = { ...pool[Math.floor(Math.random() * pool.length)] };
          newCards.push(card);
          resultDiv.innerHTML += `<div class="draw-card ${card.rarity}"><div style="font-size:11px;opacity:.9;margin-bottom:4px;">${card.rarity}</div>${card.name}</div>`;
        }

        const newInv = [...(userData.inventory || []), ...newCards];
        await db.collection("users").doc(currentUser.uid).update({
          inventory: newInv,
          drawCount: userData.drawCount
        });

        userData.inventory = newInv;
        userData.points -= cost;
        document.getElementById("my-points").textContent = userData.points;
        updateDrawProgress();
        showToast(`獲得 ${times} 張卡！`);
      } catch (e) {
        console.error(e);
        showToast("抽卡失敗");
      }
    }

    function renderInventory() {
      const filter = document.getElementById("rarity-filter").value;
      const list = document.getElementById("inventory-list");
      let inv = userData?.inventory || [];
      if (filter !== "all") inv = inv.filter(c => c.rarity === filter);

      if (inv.length === 0) {
        list.innerHTML = `<div class="empty">卡庫空空如也，去抽卡吧 ✨</div>`;
        return;
      }

      list.innerHTML = inv.map((c) => {
        const realIndex = userData.inventory.findIndex((item) => item.id === c.id && item.name === c.name);
        return `
          <div class="card-visual ${c.rarity}">
            <div class="name">${c.name} <span style="font-size:11px;opacity:.85;">${c.rarity}</span></div>
            <div class="effect">${c.effect}</div>
            <div class="exec">執行：${c.execution}</div>
            <button type="button" class="small" style="margin-top:10px;background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.4);" onclick="useCard(${realIndex})">使用（需確認）</button>
          </div>`;
      }).join("");
    }

    async function useCard(index) {
      const card = userData.inventory[index];
      if (!card) return;
      if (!confirm(`申請使用「${card.name}」？\n\n效果：${card.effect}\n\n對方確認後才正式生效。`)) return;

      try {
        const newInv = [...userData.inventory];
        newInv.splice(index, 1);
        await db.collection("users").doc(currentUser.uid).update({ inventory: newInv });
        userData.inventory = newInv;

        await db.collection("tasks").add({
          type: "card_use",
          title: `使用卡片：${card.name}`,
          card: card,
          reward: 0,
          creatorId: currentUser.uid,
          assigneeId: userData.partnerId,
          status: "completed",
          createdAt: new Date()
        });

        showToast("已發送使用申請，等待對方確認");
        renderInventory();
      } catch (e) {
        console.error(e);
        showToast("使用失敗");
      }
    }

    async function craftCard(target) {
      const needMap = { R: "N", SR: "R", SSR: "SR", UR: "SSR" };
      const need = needMap[target];
      const materials = (userData.inventory || []).filter(c => c.rarity === need);
      if (materials.length < 3) { showToast(`需要3張 ${need} 卡`); return; }
      if (!confirm(`消耗3張 ${need} 合成1張 ${target}？`)) return;

      try {
        let count = 0;
        const newInv = userData.inventory.filter(c => {
          if (c.rarity === need && count < 3) { count++; return false; }
          return true;
        });
        const pool = CARD_POOL.filter(c => c.rarity === target);
        const newCard = { ...pool[Math.floor(Math.random() * pool.length)] };
        newInv.push(newCard);

        await db.collection("users").doc(currentUser.uid).update({ inventory: newInv });
        userData.inventory = newInv;
        showToast(`合成成功！獲得 ${newCard.name}`);
        renderInventory();
      } catch (e) { showToast("合成失敗"); }
    }
  </script>
