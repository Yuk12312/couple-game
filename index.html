<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>情侶專屬好感遊戲</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe4e9);
      color: #5a3a5a;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 40px;
    }
    .container { max-width: 420px; margin: 0 auto; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(255, 105, 180, 0.12);
      margin-bottom: 16px;
    }
    h1, h2, h3 { text-align: center; color: #ff69b4; margin-bottom: 12px; }
    h3 { font-size: 16px; margin-top: 8px; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
      font-family: inherit;
    }
    input:focus { border-color: #ff69b4; }
    button {
      width: 100%;
      padding: 13px;
      background: #ff69b4;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.secondary { background: #ffb6c1; color: #5a3a5a; }
    button.danger { background: #ff6b6b; }
    button.small { padding: 8px 12px; font-size: 13px; width: auto; display: inline-block; margin: 4px 4px 0 0; }
    .points {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      color: #ff69b4;
      margin: 12px 0;
    }
    .hidden { display: none !important; }
    .error { color: #e74c3c; text-align: center; margin-bottom: 8px; font-size: 13px; }
    .success { color: #27ae60; text-align: center; margin-bottom: 8px; font-size: 13px; }
    .partner-info {
      background: #fff0f5;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .status { text-align: center; margin: 8px 0; font-size: 13px; color: #888; }
    .nav {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .nav button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      margin-bottom: 0;
    }
    .nav button.active { background: #ff1493; }
    .task-item {
      background: #fff8fa;
      border: 1px solid #ffd6e0;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .task-item .title { font-weight: bold; margin-bottom: 4px; font-size: 15px; }
    .task-item .meta { font-size: 12px; color: #888; margin-bottom: 8px; }
    .task-item .reward { color: #ff69b4; font-weight: bold; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      margin-left: 6px;
    }
    .badge.pending { background: #ffeaa7; color: #d35400; }
    .badge.completed { background: #81ecec; color: #00b894; }
    .badge.confirmed { background: #55efc4; color: #00b894; }
    .section-title {
      font-size: 15px;
      font-weight: bold;
      color: #ff69b4;
      margin: 16px 0 8px;
      border-bottom: 1px solid #ffd6e0;
      padding-bottom: 4px;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">

    <!-- 登入 / 註冊 -->
    <div id="auth-screen" class="card">
      <h1>❤️ 情侶好感遊戲</h1>
      <div id="auth-error" class="error"></div>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="密碼（至少6位）">
      <button onclick="register()">註冊</button>
      <button class="secondary" onclick="login()">登入</button>
    </div>

    <!-- 配對 -->
    <div id="pair-screen" class="card hidden">
      <h2>情侶配對</h2>
      <div id="pair-error" class="error"></div>
      <div id="pair-success" class="success"></div>
      <p class="status">你的配對碼：</p>
      <div class="points" id="my-code">------</div>
      <p class="status">或者輸入對方的配對碼：</p>
      <input type="text" id="partner-code" placeholder="輸入6位配對碼" maxlength="6">
      <button onclick="pairWithCode()">確認配對</button>
      <button class="secondary" onclick="logout()">登出</button>
    </div>

    <!-- 主畫面 -->
    <div id="home-screen" class="hidden">
      <div class="nav">
        <button id="nav-home" class="active" onclick="switchTab('home')">點數</button>
        <button id="nav-tasks" onclick="switchTab('tasks')">任務</button>
      </div>

      <!-- 點數 Tab -->
      <div id="tab-home" class="card">
        <h2>甜蜜點數</h2>
        <div class="points" id="my-points">0</div>
        <div class="partner-info">
          已配對：<span id="partner-name">—</span>
        </div>

        <h3>送點數給對方</h3>
        <input type="number" id="send-amount" placeholder="輸入要送的點數" min="1">
        <button onclick="sendPoints()">送出點數</button>
        <div id="home-message" class="success"></div>
        <button class="secondary" onclick="logout()" style="margin-top:12px;">登出</button>
      </div>

      <!-- 任務 Tab -->
      <div id="tab-tasks" class="hidden">
        <div class="card">
          <h2>任務中心</h2>
          <div class="section-title">建立自訂任務</div>
          <input type="text" id="new-task-title" placeholder="任務內容（例如：親一下對方）">
          <input type="number" id="new-task-reward" placeholder="獎勵點數（從你帳戶扣除）" min="1">
          <button onclick="createCustomTask()">建立任務</button>
          <div id="task-create-msg" class="success"></div>
        </div>

        <div class="card">
          <div class="section-title">每日任務（完成後需對方確認）</div>
          <div id="daily-tasks-list"></div>
        </div>

        <div class="card">
          <div class="section-title">等待我確認的任務</div>
          <div id="pending-confirm-list"></div>
        </div>

        <div class="card">
          <div class="section-title">我發起的任務</div>
          <div id="my-created-tasks"></div>
        </div>

        <div class="card">
          <div class="section-title">對方發起給我的任務</div>
          <div id="partner-tasks"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAqmFiLSEKgYNlscQkwGc4TVlEeh_GV-F8",
      authDomain: "couple-card-game-d8852.firebaseapp.com",
      projectId: "couple-card-game-d8852",
      storageBucket: "couple-card-game-d8852.firebasestorage.app",
      messagingSenderId: "1089424772159",
      appId: "1:1089424772159:web:8c0546fe679ba86cfbfc8a",
      measurementId: "G-0RLX4JTBGP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let userData = null;

    const DAILY_TASKS = [
      { id: "daily_1", title: "對對方說一句「我愛你」", reward: 5 },
      { id: "daily_2", title: "親一下對方", reward: 8 },
      { id: "daily_3", title: "擁抱對方至少10秒", reward: 8 },
      { id: "daily_4", title: "送對方一個小驚喜（訊息/貼圖/關心）", reward: 10 },
      { id: "daily_5", title: "一起做一件事（食飯/睇片/傾偈）", reward: 12 }
    ];

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        await loadUserData();
      } else {
        showScreen("auth-screen");
      }
    });

    function showScreen(id) {
      ["auth-screen", "pair-screen", "home-screen"].forEach(s => {
        document.getElementById(s).classList.add("hidden");
      });
      document.getElementById(id).classList.remove("hidden");
    }

    function switchTab(tab) {
      document.getElementById("tab-home").classList.add("hidden");
      document.getElementById("tab-tasks").classList.add("hidden");
      document.getElementById("nav-home").classList.remove("active");
      document.getElementById("nav-tasks").classList.remove("active");

      if (tab === "home") {
        document.getElementById("tab-home").classList.remove("hidden");
        document.getElementById("nav-home").classList.add("active");
      } else {
        document.getElementById("tab-tasks").classList.remove("hidden");
        document.getElementById("nav-tasks").classList.add("active");
        loadTasks();
      }
    }

    async function register() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("auth-error");
      errorEl.textContent = "";

      if (!email || !password) {
        errorEl.textContent = "請填寫 Email 同密碼";
        return;
      }

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const code = generateCode();
        
        await db.collection("users").doc(cred.user.uid).set({
          email: email,
          points: 50,
          pairCode: code,
          partnerId: null,
          createdAt: new Date()
        });

        await db.collection("codes").doc(code).set({ uid: cred.user.uid });
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("auth-error");
      errorEl.textContent = "";

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        errorEl.textContent = "登入失敗，請檢查 Email 或密碼";
      }
    }

    function logout() {
      auth.signOut();
    }

    function generateCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    async function loadUserData() {
      const doc = await db.collection("users").doc(currentUser.uid).get();
      if (!doc.exists) return;

      userData = doc.data();

      if (userData.partnerId) {
        showScreen("home-screen");
        document.getElementById("my-points").textContent = userData.points;
        
        const partnerDoc = await db.collection("users").doc(userData.partnerId).get();
        if (partnerDoc.exists) {
          document.getElementById("partner-name").textContent = partnerDoc.data().email.split("@")[0];
        }
        switchTab("home");
      } else {
        showScreen("pair-screen");
        document.getElementById("my-code").textContent = userData.pairCode;
      }
    }

    async function pairWithCode() {
      const code = document.getElementById("partner-code").value.trim();
      const errorEl = document.getElementById("pair-error");
      const successEl = document.getElementById("pair-success");
      errorEl.textContent = "";
      successEl.textContent = "";

      if (code.length !== 6) {
        errorEl.textContent = "請輸入 6 位配對碼";
        return;
      }
      if (code === userData.pairCode) {
        errorEl.textContent = "唔可以輸入自己的配對碼";
        return;
      }

      try {
        const codeDoc = await db.collection("codes").doc(code).get();
        if (!codeDoc.exists) {
          errorEl.textContent = "配對碼不存在";
          return;
        }

        const partnerId = codeDoc.data().uid;
        await db.collection("users").doc(currentUser.uid).update({ partnerId });
        await db.collection("users").doc(partnerId).update({ partnerId: currentUser.uid });

        successEl.textContent = "配對成功！";
        setTimeout(() => loadUserData(), 800);
      } catch (err) {
        errorEl.textContent = "配對失敗：" + err.message;
      }
    }

    async function sendPoints() {
      const amount = parseInt(document.getElementById("send-amount").value);
      const msgEl = document.getElementById("home-message");
      msgEl.textContent = "";

      if (!amount || amount <= 0) {
        msgEl.textContent = "請輸入正確點數";
        msgEl.className = "error";
        return;
      }
      if (userData.points < amount) {
        msgEl.textContent = "點數不足";
        msgEl.className = "error";
        return;
      }

      try {
        await db.collection("users").doc(currentUser.uid).update({
          points: firebase.firestore.FieldValue.increment(-amount)
        });
        await db.collection("users").doc(userData.partnerId).update({
          points: firebase.firestore.FieldValue.increment(amount)
        });

        msgEl.textContent = `成功送出 ${amount} 點！`;
        msgEl.className = "success";
        document.getElementById("send-amount").value = "";
        await loadUserData();
      } catch (err) {
        msgEl.textContent = "送出失敗：" + err.message;
        msgEl.className = "error";
      }
    }

    // ========== 任務系統 ==========
    async function createCustomTask() {
      const title = document.getElementById("new-task-title").value.trim();
      const reward = parseInt(document.getElementById("new-task-reward").value);
      const msgEl = document.getElementById("task-create-msg");
      msgEl.textContent = "";

      if (!title || !reward || reward <= 0) {
        msgEl.textContent = "請填寫任務內容同獎勵點數";
        msgEl.className = "error";
        return;
      }
      if (userData.points < reward) {
        msgEl.textContent = "你的點數不足支付獎勵";
        msgEl.className = "error";
        return;
      }

      try {
        await db.collection("users").doc(currentUser.uid).update({
          points: firebase.firestore.FieldValue.increment(-reward)
        });

        await db.collection("tasks").add({
          title: title,
          reward: reward,
          creatorId: currentUser.uid,
          assigneeId: userData.partnerId,
          type: "custom",
          status: "pending",
          createdAt: new Date()
        });

        msgEl.textContent = "任務已建立！對方而家應該見得到";
        msgEl.className = "success";
        document.getElementById("new-task-title").value = "";
        document.getElementById("new-task-reward").value = "";
        await loadUserData();
        loadTasks();
      } catch (err) {
        msgEl.textContent = "建立失敗：" + err.message;
        msgEl.className = "error";
      }
    }

    async function loadTasks() {
      if (!userData || !userData.partnerId) return;

      try {
        // 1. 每日任務
        const dailyList = document.getElementById("daily-tasks-list");
        dailyList.innerHTML = "";

        const todayStart = new Date();
        todayStart.setHours(0,0,0,0);

        // 簡化查詢：只查自己作為 assignee 的每日任務
        const dailySnap = await db.collection("tasks")
          .where("assigneeId", "==", currentUser.uid)
          .where("type", "==", "daily")
          .get();

        const myDailyStatus = {};
        dailySnap.forEach(doc => {
          const t = doc.data();
          const created = t.createdAt?.toDate ? t.createdAt.toDate() : new Date(0);
          if (created >= todayStart) {
            myDailyStatus[t.dailyId] = { id: doc.id, status: t.status };
          }
        });

        DAILY_TASKS.forEach(dt => {
          const existing = myDailyStatus[dt.id];
          let statusHtml = "";
          let btnHtml = "";

          if (!existing) {
            btnHtml = `<button class="small" onclick="claimDailyTask('${dt.id}', '${dt.title}', ${dt.reward})">我完成了</button>`;
          } else if (existing.status === "completed") {
            statusHtml = `<span class="badge completed">等待對方確認</span>`;
          } else if (existing.status === "confirmed") {
            statusHtml = `<span class="badge confirmed">已確認 +${dt.reward}</span>`;
          }

          dailyList.innerHTML += `
            <div class="task-item">
              <div class="title">${dt.title} ${statusHtml}</div>
              <div class="meta">獎勵：<span class="reward">+${dt.reward} 點</span></div>
              ${btnHtml}
            </div>
          `;
        });

        // 2. 等待我確認的任務（對方完成的，無論是自訂定每日）
        const pendingConfirm = document.getElementById("pending-confirm-list");
        pendingConfirm.innerHTML = "";

        // 查詢所有 status = completed 且 assignee 係對方 的任務
        const confirmSnap = await db.collection("tasks")
          .where("status", "==", "completed")
          .get();

        let hasPending = false;
        confirmSnap.forEach(doc => {
          const t = doc.data();
          // 只顯示對方完成、等待我確認的
          if (t.assigneeId === userData.partnerId || (t.type === "daily" && t.assigneeId === userData.partnerId)) {
            hasPending = true;
            pendingConfirm.innerHTML += `
              <div class="task-item">
                <div class="title">${t.title} <span class="badge completed">等待確認</span></div>
                <div class="meta">獎勵：<span class="reward">${t.reward} 點</span> · ${t.type === "daily" ? "每日任務" : "自訂任務"}</div>
                <button class="small" onclick="confirmTask('${doc.id}', ${t.reward}, '${t.assigneeId}')">確認完成</button>
                <button class="small danger" onclick="rejectTask('${doc.id}', ${t.reward}, '${t.creatorId}')">拒絕</button>
              </div>
            `;
          }
        });
        if (!hasPending) {
          pendingConfirm.innerHTML = `<p class="status">暫時沒有需要確認的任務</p>`;
        }

        // 3. 我發起的自訂任務
        const myCreated = document.getElementById("my-created-tasks");
        myCreated.innerHTML = "";

        const mySnap = await db.collection("tasks")
          .where("creatorId", "==", currentUser.uid)
          .get();

        if (mySnap.empty) {
          myCreated.innerHTML = `<p class="status">暫時沒有</p>`;
        } else {
          mySnap.forEach(doc => {
            const t = doc.data();
            let statusText = "";
            let actionHtml = "";

            if (t.status === "pending") statusText = `<span class="badge pending">等待對方完成</span>`;
            else if (t.status === "completed") {
              statusText = `<span class="badge completed">對方已完成</span>`;
              // 確認按鈕已在上面「等待我確認」區塊
            } else if (t.status === "confirmed") {
              statusText = `<span class="badge confirmed">已確認</span>`;
            } else if (t.status === "rejected") {
              statusText = `<span class="badge pending">已拒絕</span>`;
            }

            myCreated.innerHTML += `
              <div class="task-item">
                <div class="title">${t.title} ${statusText}</div>
                <div class="meta">獎勵：<span class="reward">${t.reward} 點</span></div>
              </div>
            `;
          });
        }

        // 4. 對方發起給我的自訂任務
        const partnerList = document.getElementById("partner-tasks");
        partnerList.innerHTML = "";

        const partnerSnap = await db.collection("tasks")
          .where("assigneeId", "==", currentUser.uid)
          .where("type", "==", "custom")
          .get();

        if (partnerSnap.empty) {
          partnerList.innerHTML = `<p class="status">暫時沒有</p>`;
        } else {
          partnerSnap.forEach(doc => {
            const t = doc.data();
            let statusText = "";
            let actionHtml = "";

            if (t.status === "pending") {
              statusText = `<span class="badge pending">待完成</span>`;
              actionHtml = `<button class="small" onclick="completeTask('${doc.id}')">我完成了</button>`;
            } else if (t.status === "completed") {
              statusText = `<span class="badge completed">等待對方確認</span>`;
            } else if (t.status === "confirmed") {
              statusText = `<span class="badge confirmed">已確認 +${t.reward}</span>`;
            }

            partnerList.innerHTML += `
              <div class="task-item">
                <div class="title">${t.title} ${statusText}</div>
                <div class="meta">獎勵：<span class="reward">+${t.reward} 點</span></div>
                ${actionHtml}
              </div>
            `;
          });
        }

      } catch (err) {
        console.error(err);
        alert("載入任務失敗：" + err.message + "\n\n如果提到 index，請去 Firebase Console 建立索引。");
      }
    }

    async function claimDailyTask(dailyId, title, reward) {
      try {
        await db.collection("tasks").add({
          dailyId: dailyId,
          title: title,
          reward: reward,
          creatorId: "system",
          assigneeId: currentUser.uid,
          type: "daily",
          status: "completed",
          createdAt: new Date()
        });
        alert("已提交！等待對方確認後先會加點數");
        loadTasks();
      } catch (err) {
        alert("提交失敗：" + err.message);
      }
    }

    async function completeTask(taskId) {
      try {
        await db.collection("tasks").doc(taskId).update({
          status: "completed",
          completedAt: new Date()
        });
        alert("已通知對方，等待確認");
        loadTasks();
      } catch (err) {
        alert("操作失敗：" + err.message);
      }
    }

    async function confirmTask(taskId, reward, assigneeId) {
      try {
        // 把點數轉給完成者
        await db.collection("users").doc(assigneeId).update({
          points: firebase.firestore.FieldValue.increment(reward)
        });

        await db.collection("tasks").doc(taskId).update({
          status: "confirmed",
          confirmedAt: new Date()
        });

        alert("已確認，點數已發給對方！");
        loadTasks();
        await loadUserData();
      } catch (err) {
        alert("確認失敗：" + err.message);
      }
    }

    async function rejectTask(taskId, reward, creatorId) {
      if (!confirm("確定拒絕？點數會退回給發起人")) return;

      try {
        // 退回點數給發起人（如果係自訂任務）
        if (creatorId && creatorId !== "system") {
          await db.collection("users").doc(creatorId).update({
            points: firebase.firestore.FieldValue.increment(reward)
          });
        }

        await db.collection("tasks").doc(taskId).update({
          status: "rejected"
        });
        alert("已拒絕");
        loadTasks();
        await loadUserData();
      } catch (err) {
        alert("操作失敗：" + err.message);
      }
    }
  </script>
</body>
</html>
